<div x-data="roomDashboard()" x-init="fetchRoomStatus()">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
      <div>
        <p class="text-sm text-gray-500 font-medium uppercase tracking-wider">Total Rooms Available</p>
        <h4 class="text-3xl font-bold text-gray-800 mt-1" x-text="metrics.vacant">0</h4>
      </div>
      <div class="p-3 rounded-full bg-green-50 text-green-500 text-2xl">🟢</div>
    </div>
    
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
      <div>
        <p class="text-sm text-gray-500 font-medium uppercase tracking-wider">Rooms Occupied</p>
        <h4 class="text-3xl font-bold text-gray-800 mt-1" x-text="metrics.occupied">0</h4>
      </div>
      <div class="p-3 rounded-full bg-indigo-50 text-indigo-500 text-2xl">🏨</div>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
      <div>
        <p class="text-sm text-gray-500 font-medium uppercase tracking-wider">Dirty / Maintenance</p>
        <h4 class="text-3xl font-bold text-gray-800 mt-1" x-text="metrics.dirty">0</h4>
      </div>
      <div class="p-3 rounded-full bg-amber-50 text-amber-500 text-2xl">🧹</div>
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <template x-for="room in rooms" :key="room.number">
      <div class="bg-white rounded-xl shadow-sm border overflow-hidden transition-all duration-200 hover:shadow-md"
           :class="room.status === 'Occupied' ? 'border-indigo-100' : 'border-gray-200'">
        
        <div class="px-5 py-3 flex items-center justify-between text-xs font-bold uppercase tracking-wide border-b"
             :class="{
               'bg-green-50 text-green-700 border-green-100': room.status === 'Vacant Clean',
               'bg-indigo-50 text-indigo-700 border-indigo-100': room.status === 'Occupied',
               'bg-amber-50 text-amber-700 border-amber-100': room.status === 'Vacant Dirty'
             }">
          <span x-text="'Room ' + room.number"></span>
          <span x-text="room.status"></span>
        </div>

        <div class="p-5">
          <h4 class="text-lg font-bold text-gray-800" x-text="room.name"></h4>
          <p class="text-xs text-gray-400 mt-1" x-text="'Type: ' + room.type"></p>
          
          <div class="mt-4 pt-4 border-t border-gray-50 flex items-center justify-between text-sm">
            <span class="text-gray-500">Current Rate:</span>
            <span class="font-semibold text-gray-900" x-text="'₹' + room.base_rate + '/night'"></span>
          </div>
        </div>

        <div class="px-5 py-3 bg-gray-50 border-t border-gray-100 flex justify-end">
          <template x-if="room.status === 'Vacant Clean'">
            <button @click="quickCheckIn(room.number)" class="w-full text-center px-3 py-2 text-xs font-semibold text-white bg-green-600 hover:bg-green-700 rounded-lg transition-colors shadow-sm">
              Quick Check-In
            </button>
          </template>
          <template x-if="room.status === 'Occupied'">
            <button @click="triggerCheckout(room.current_booking_id)" class="w-full text-center px-3 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors shadow-sm">
              Process Checkout
            </button>
          </template>
          <template x-if="room.status === 'Vacant Dirty'">
            <button @click="markClean(room.number)" class="w-full text-center px-3 py-2 text-xs font-semibold text-gray-700 bg-white border border-gray-300 hover:bg-gray-50 rounded-lg transition-colors shadow-sm">
              Mark Cleaned 🧹
            </button>
          </template>
        </div>

      </div>
    </template>
  </div>
</div>

<script>
function roomDashboard() {
  return {
    rooms: [
      { number: "1", name: "Sun Rising", type: "Super Deluxe", base_rate: 5500, status: "Vacant Clean", current_booking_id: null },
      { number: "2", name: "Purple Room", type: "Deluxe", base_rate: 5500, status: "Occupied", current_booking_id: "BK-8932" },
      { number: "3", name: "Scarlet Room", type: "Deluxe", base_rate: 5500, status: "Vacant Dirty", current_booking_id: null },
      { number: "4", name: "Blue room", type: "Luxury Suite", base_rate: 5500, status: "Vacant Clean", current_booking_id: null },
      { number: "5", name: "Green room", type: "Super Deluxe", base_rate: 5500, status: "Occupied", current_booking_id: "BK-4421" },
      { number: "6", name: "Opium room", type: "Deluxe", base_rate: 5500, status: "Vacant Clean", current_booking_id: null },
      { number: "7", name: "Red Maharani", type: "Grand Suite", base_rate: 5500, status: "Vacant Clean", current_booking_id: null }
    ],
    metrics: { vacant: 4, occupied: 2, dirty: 1 },

    fetchRoomStatus() {
      console.log("Dashboard pipeline active. Ready for backend sync hooks.");
    },
    quickCheckIn(roomNum) {
      alert("Redirecting context to create reservation for Room: " + roomNum);
    },
    triggerCheckout(bookingId) {
      alert("Invoking backend controller for dynamic checkout mapping on: " + bookingId);
    },
    markClean(roomNum) {
      const room = this.rooms.find(r => r.number === roomNum);
      if (room) {
        room.status = "Vacant Clean";
        this.metrics.dirty--;
        this.metrics.vacant++;
      }
    }
  }
}
</script>
