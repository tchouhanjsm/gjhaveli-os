<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GarhJaisal OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="bg-gray-50 font-sans text-gray-900" x-data="{ currentTab: 'dashboard' }">
    <div class="flex h-screen overflow-hidden">
      <aside class="w-64 bg-indigo-900 text-white flex flex-col justify-between">
        <div class="p-5">
          <h1 class="text-xl font-bold tracking-wider text-indigo-200">GJ Haveli OS</h1>
          <p class="text-xs text-indigo-400 mt-1">v1.0.0 (Stable)</p>

          <nav class="mt-8 space-y-2">
            <button
              @click="currentTab = 'dashboard'"
              :class="currentTab === 'dashboard' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:bg-indigo-800'"
              class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors"
            >
              📊 Dashboard
            </button>
            <button
              @click="currentTab = 'bookings'"
              :class="currentTab === 'bookings' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:bg-indigo-800'"
              class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors"
            >
              🛏️ Bookings / Forms
            </button>
            <button
              @click="currentTab = 'expenses'"
              :class="currentTab === 'expenses' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:bg-indigo-800'"
              class="w-full flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors"
            >
              💰 Finances & Payroll
            </button>
          </nav>
        </div>

        <div class="p-4 border-t border-indigo-800 text-xs text-indigo-300">
          Active Session:
          <span class="font-mono block text-white"><?= Session.getActiveUser().getEmail() ?></span>
        </div>
      </aside>

      <main class="flex-1 flex flex-col overflow-y-auto bg-gray-100">
        <header class="bg-white shadow-sm px-8 py-4 flex items-center justify-between">
          <h2
            class="text-lg font-semibold text-gray-700 uppercase tracking-wider"
            x-text="currentTab + ' Management'"
          ></h2>
        </header>

        <div class="p-8">
          <div x-show="currentTab === 'dashboard'"><?!= include('web/dashboard'); ?></div>
          <div x-show="currentTab === 'bookings'" x-cloak><?!= include('web/bookings'); ?></div>
          <div x-show="currentTab === 'expenses'" x-cloak><?!= include('web/expenses'); ?></div>
        </div>
      </main>
    </div>
  </body>
</html>
