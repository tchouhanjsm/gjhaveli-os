name: GarhJaisal CI/CD

on:
  push:
    branches:
      - "**" # 🚀 This tells GitHub to run the Lint checks on ANY branch push!

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linter
        run: npm run lint

  deploy:
    needs: lint
    # 🔒 Safety Gate: ONLY deploy via Clasp if changes land on the 'main' branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Authenticate with Google Clasp
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > "$HOME/.clasprc.json"

      - name: Push to Google Apps Script
        run: npx clasp push --force
