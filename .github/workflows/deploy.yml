name: GarhJaisal CI/CD

on:
  push:
    branches:
      - "**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Code Linter
        run: npm run lint

  deploy:
    needs: lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Authenticate with Google Clasp
        run: |
          # Safely decode the credentials without shell text interference
          echo "${{ secrets.CLASPRC_JSON }}" | base64 --decode > "$HOME/.clasprc.json"

      - name: Restore Project Settings Configuration
        run: |
          # Safely decode the project configuration file
          echo "${{ secrets.CLASP_JSON }}" | base64 --decode > .clasp.json

      - name: Push to Google Apps Script
        run: npx clasp push --force
